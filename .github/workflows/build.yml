name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:2.5
    steps:
      - uses: actions/checkout@v4

      - name: West init/update (use this repo as the manifest)
        run: |
          west init -l config
          west update

      - name: Build LEFT
        run: |
          west build -s zmk/app -d build/left -b corneish_zen_v2_left -- \
            -DZMK_CONFIG=${{ github.workspace }}/config
          cp build/left/zephyr/zmk.uf2 corneish_zen_v2_left.uf2

      - name: Build RIGHT
        run: |
          west build -s zmk/app -d build/right -b corneish_zen_v2_right -- \
            -DZMK_CONFIG=${{ github.workspace }}/config
          cp build/right/zephyr/zmk.uf2 corneish_zen_v2_right.uf2

      - name: Build settings_reset
        run: |
          west build -s zmk/app -d build/reset -b nice_nano_v2 -- \
            -DZMK_CONFIG=${{ github.workspace }}/config -DSHIELD=settings_reset
          cp build/reset/zephyr/zmk.uf2 settings_reset_nice_nano_v2.uf2

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            corneish_zen_v2_left.uf2
            corneish_zen_v2_right.uf2
            settings_reset_nice_nano_v2.uf2
          if-no-files-found: error
          retention-days: 7
